[package]
name = "horizon-client-hud"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version = "1.90"
description = "Horizon CPU HUD atlas and batch"

[dependencies]
horizon-assets = { path = "../horizon-assets" }
horizon-client-core = { path = "../horizon-client-core" }
horizon-client-font = { path = "../horizon-client-font" }
horizon-core = { path = "../horizon-core" }
horizon-hud-data = { path = "../horizon-hud-data" }
horizon-items = { path = "../horizon-items" }
horizon-optifine = { path = "../horizon-optifine" }
horizon-shaders = { path = "../horizon-shaders" }
horizon-terrain-mesh = { path = "../horizon-terrain-mesh", default-features = false }
image-webp = { version = "0.2", default-features = false }
log = "0.4"
lz4_flex = { version = "0.14", default-features = false, features = ["std", "safe-encode", "safe-decode", "checked-decode"] }
png = "0.18"
serde_json = { version = "1.0.151", features = ["raw_value"] }
zune-jpeg = { version = "0.4", default-features = false, features = ["std"] }

[dev-dependencies]
horizon-terrain-mesh = { path = "../horizon-terrain-mesh", default-features = false, features = ["test-support"] }

[target.'cfg(not(target_has_atomic = "64"))'.dependencies]
portable-atomic = { version = "1.15", default-features = false, features = ["fallback"] }

[target.'cfg(target_os = "cafe")'.dependencies]
horizon-client-platform = { path = "../horizon-client-platform" }

[lints]
workspace = true
