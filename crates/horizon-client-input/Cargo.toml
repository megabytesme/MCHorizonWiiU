[package]
name = "horizon-client-input"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version = "1.90"
description = "The client's input layer: key bindings and their names, mouse, controllers, clipboard and window options"

[dependencies]
horizon-client-core = { path = "../horizon-client-core" }
horizon-client-platform = { path = "../horizon-client-platform" }
winit = { version = "0.30.13", optional = true }
# The window icon.
horizon-theme = { path = "../horizon-theme", optional = true }
png = { version = "0.18", optional = true }
# The DualSense's trigger effects (the `controllers` feature).
horizon-dualsense = { path = "../horizon-dualsense", optional = true }

[target.'cfg(not(target_os = "cafe"))'.dependencies]
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"], optional = true }

[features]
default = ["desktop"]
desktop = ["dep:winit", "dep:horizon-theme", "dep:png", "dep:arboard"]
controllers = ["dep:horizon-dualsense"]

[lints]
workspace = true
