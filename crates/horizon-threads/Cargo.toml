[package]
name = "horizon-threads"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version = "1.85"
description = "Scheduling hints for the game's threads and its allocator, and the other OS calls the crates that forbid unsafe code can't make"

[target.'cfg(not(target_os = "cafe"))'.dependencies]
mimalloc = { version = "0.1.52", default-features = false, optional = true }
libmimalloc-sys = { version = "0.1.49", default-features = false, features = ["extended"], optional = true }

[target.'cfg(any(target_vendor = "apple", target_os = "linux", target_os = "android"))'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Console", "Win32_System_IO", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_System_WindowsProgramming", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(not(target_has_atomic = "64"))'.dependencies]
portable-atomic = { version = "1.15", default-features = false, features = ["fallback"] }

[features]
default = ["mimalloc"]
mimalloc = ["dep:mimalloc", "dep:libmimalloc-sys"]
# Counts live heap bytes by startup step and thread (`CensusAllocator`); for measuring only.
alloc-census = ["mimalloc"]

[lints]
workspace = true
