[package]
name = "horizon-client-font"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version = "1.90"
description = "Horizon client font loading and text shaping"

[dependencies]
ab_glyph = "0.2.32"
horizon-client-core = { path = "../horizon-client-core" }
horizon-client-input = { path = "../horizon-client-input", default-features = false }
horizon-assets = { path = "../horizon-assets" }
horizon-core = { path = "../horizon-core" }
horizon-hud-data = { path = "../horizon-hud-data" }
horizon-resource-zip = { path = "../horizon-resource-zip" }
log = "0.4"
png = "0.18"
serde_json = { version = "1.0.151", features = ["raw_value"] }
unicode-bidi = "0.3.18"

[target.'cfg(not(target_has_atomic = "64"))'.dependencies]
portable-atomic = "1"

[dev-dependencies]
horizon-theme = { path = "../horizon-theme" }

[lints]
workspace = true
