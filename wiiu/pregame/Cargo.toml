[package]
name = "horizon-wiiu-pregame"
version = "0.3.0"
edition = "2021"
publish = false

[workspace]

[lib]
path = "src/lib.rs"

[dev-dependencies]
horizon-wiiu-microsoft = { path = "../microsoft", features = ["fixture"] }
horizon-wiiu-security = { path = "../security" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(horizon_wiiu_cafe)', 'cfg(horizon_wiiu_pregame_fixture)', 'cfg(horizon_wiiu_hosted)', 'cfg(horizon_wiiu_native_mcp)'] }
