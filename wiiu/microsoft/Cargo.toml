[package]
name = "horizon-wiiu-microsoft"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[features]
fixture = []

[dependencies]
horizon-wiiu-security = { path = "../security" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.12.1", default-features = false, features = ["tls"] }
zeroize = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("cafe"))'] }
