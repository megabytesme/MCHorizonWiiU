[package]
name = "horizon-wiiu-mcp"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
base64 = "0.22.1"
horizon-wiiu-security = { path = "../security" }
ring = "0.17.14"
rcgen = { version = "0.14.10", default-features = false, features = ["ring"] }
rustls = { version = "0.23.46", default-features = false, features = ["std", "ring", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2.6"
url = "2.5.8"
zeroize = "1"
