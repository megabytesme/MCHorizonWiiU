[package]
name = "horizon-wiiu-platform"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = []
cafe = []
horizon-hud = ["dep:horizon-client-hud"]

[dependencies]
horizon-client-input = { path = "../../crates/horizon-client-input", default-features = false }
horizon-client-platform = { path = "../../crates/horizon-client-platform" }
horizon-client-hud = { path = "../../crates/horizon-client-hud", optional = true }
horizon-hud-data = { path = "../../crates/horizon-hud-data" }

[dev-dependencies]
horizon-terrain-mesh = { path = "../../crates/horizon-terrain-mesh", default-features = false, features = ["test-support"] }

[workspace]

[patch.crates-io]
# Use the same shader translation fixes as the Horizon workspace.
naga = { path = "../../third_party/naga" }
# Keep the custom backend symbols version-specific on Cafe.
getrandom = { path = "../../third_party/getrandom-0.4.3" }
