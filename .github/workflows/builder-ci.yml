name: Port compatibility checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: python3 -B -m unittest discover -s wiiu/builder -v
      - run: cargo test --locked --manifest-path wiiu/pregame/Cargo.toml
      - run: cargo clippy --locked --manifest-path wiiu/pregame/Cargo.toml --all-targets -- -D warnings
      - run: python3 tools/check_public_tree.py --history
