name: Wii U public source validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read

jobs:
  host:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: '10.0.x'
      - run: git fetch --unshallow --no-tags origin "$GITHUB_SHA"
        shell: bash
      - run: python -B -m unittest discover -s wiiu/builder -v
      - name: Validate catalog and documentation
        shell: bash
        run: |
          trust=()
          if test -f catalog/releases-v2.sig; then
            trust=(--signature catalog/releases-v2.sig --public-key catalog/catalog-public.der
                   --trust-state "$RUNNER_TEMP/wiiu-catalog-trust.json")
          fi
          python -B tools/check_release.py "${trust[@]}"
      - run: dotnet run --project tools/catalog-signer -- self-test catalog/releases-v2.json
      - run: cargo fmt --manifest-path wiiu/pregame/Cargo.toml --check
      - run: cargo clippy --locked --manifest-path wiiu/pregame/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path wiiu/pregame/Cargo.toml

  public-source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Audit reachable port-only commits
        run: |
          git fetch --unshallow --no-tags origin "$GITHUB_SHA"
          python3 -B tools/check_public_tree.py --ref HEAD
          curl -fLsS https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --log-opts=HEAD --redact=100 --no-banner .
      - name: Reconstruct the verified 0.7.0 rollback build inputs
        id: rollback
        run: |
          rollback="$RUNNER_TEMP/wiiu-rollback"
          git worktree add --detach "$rollback" 037cf5618afd75497416917ca8ade1a8eb823c60
          cd "$rollback"
          trust=(--allow-unsigned)
          if test -f catalog/releases-v2.sig; then
            trust=(--signature catalog/releases-v2.sig --public-key catalog/catalog-public.der)
            export XDG_STATE_HOME="$RUNNER_TEMP/wiiu-state"
          fi
          builder=(python3 -B wiiu/builder/workflow.py "${trust[@]}" --cache "$RUNNER_TEMP/wiiu")
          "${builder[@]}" check-source
          "${builder[@]}" prepare-overlays
          "${builder[@]}" --offline check-source
          overlays=$("${builder[@]}" --offline prepare-overlays)
          printf 'overlays=%s\n' "$overlays" >> "$GITHUB_OUTPUT"
      - name: Assemble the pinned hosted Nightly twice
        env:
          CAFE_INPUTS: ${{ steps.rollback.outputs.overlays }}
        run: |
          nightly="$RUNNER_TEMP/horizon-nightly"
          pin=$(python3 -c 'import json; print(json.load(open("catalog/hosted-nightly-2026-11-20.json"))["upstream"]["commit"])')
          git init --quiet "$nightly"
          git -C "$nightly" fetch --quiet --depth=1 --no-tags --no-recurse-submodules \
            https://github.com/horizon-rust/horizon.git "$pin"
          git -C "$nightly" checkout --quiet --detach FETCH_HEAD
          for lane in a b; do
            python3 -B wiiu/builder/build.py assemble-hosted-nightly \
              --source "$nightly" --inputs "$CAFE_INPUTS" --output "$RUNNER_TEMP/nightly-$lane"
          done
          cmp "$RUNNER_TEMP/nightly-a/nightly-source-record.json" "$RUNNER_TEMP/nightly-b/nightly-source-record.json"
          cmp "$RUNNER_TEMP/nightly-a/Cargo.lock" "$RUNNER_TEMP/nightly-b/Cargo.lock"
      - name: Stage immutable 0.7.0 source releases
        run: |
          cd "$RUNNER_TEMP/wiiu-rollback"
          revision="$(git rev-parse HEAD)"
          output="$RUNNER_TEMP/source-candidates"
          python3 -B tools/prepare_release.py builder 0.6.0 --revision "$revision" --output "$output"
          python3 -B tools/prepare_release.py client 0.7.0 --revision "$revision" --output "$output"
          python3 -B tools/prepare_release.py patch 0.4.0 --revision "$revision" --output "$output"
          python3 -B tools/prepare_release.py toolchain 1.0.0 --revision "$revision" --output "$output"
